services:
  postgres:
    image: postgres:16-alpine
    container_name: iringa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iringa
      POSTGRES_PASSWORD: iringa_dev_password
      POSTGRES_DB: iringa_dating
    ports:
      - "5432:5432"
    volumes:
      - iringa_pgdata:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iringa -d iringa_dating"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: iringa_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - iringa_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  iringa_pgdata:
  iringa_redisdata: